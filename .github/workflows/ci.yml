name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests and installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go test -count=1 ./...
      - run: go build ./cmd/talento
      - name: Smoke test built TUI in a real terminal
        if: runner.os != 'Windows'
        run: TALENTO_TUI_BINARY="$PWD/talento" go test -count=1 ./internal/tui -run '^TestTUIPackagedStartup$'
      - name: Test POSIX and Bash installers
        if: runner.os != 'Windows'
        run: sh scripts/test-installers.sh
      - name: Test Windows PowerShell 5.1 installer
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-installers.ps1
      - name: Test PowerShell 7 installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-installers.ps1
      - name: Smoke test completion generation
        run: |
          binary=./talento
          if [[ "${{ runner.os }}" == "Windows" ]]; then binary=./talento.exe; fi
          "$binary" completion bash >/dev/null
          "$binary" completion zsh >/dev/null
          "$binary" completion fish >/dev/null
          "$binary" completion powershell >/dev/null

  quality:
    name: Module, format, vet, and coverage policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify downloaded modules
        run: go mod verify
      - name: Check module tidiness without modifying the checkout
        run: go mod tidy -diff
      - name: Check Go formatting
        run: ./scripts/check-go-format.sh
      - name: Run go vet
        run: go vet ./...
      - name: Enforce Go statement coverage floor
        run: ./scripts/check-go-coverage.sh

  race:
    name: Race detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...

  workflow-policy:
    name: GitHub Actions policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Enforce immutable workflow dependencies and token policy
        run: ./scripts/check-workflow-policy.sh
      - name: Exercise workflow-policy regressions
        run: ./scripts/test-check-workflow-policy.sh
      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          online-audits: false
          version: 1.29.0

  generated-and-skills:
    name: Generated schema and skills
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: go run ./cmd/schemagen -check
      - run: go run ./cmd/surfacegen -check
      - run: go run ./cmd/packageextras --version 0.1.0 --output dist
      - run: go run ./cmd/artifactcheck --dir dist
      - run: go run ./cmd/packagecompletions --output dist/completions
      - run: |
          test -s dist/completions/talento.bash
          test -s dist/completions/_talento
          test -s dist/completions/talento.fish
          test -s dist/completions/talento.ps1
      - run: python -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - run: skills-ref validate skills/talento
      - run: skills-ref validate plugins/talento/skills/talento
      - run: skills-ref validate plugins/claude-code/skills/talento

  release-config:
    name: Release configuration and static gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: sh scripts/test-check-stable-gates.sh
      - run: sh scripts/test-repackage-signed.sh
      - run: ./scripts/check-workflow-policy.sh
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check

  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -trimpath ./cmd/talento
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
