name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod verify
      - run: go mod tidy -diff
      - run: ./scripts/check-go-format.sh
      - run: ./scripts/check-workflow-policy.sh
      - run: ./scripts/check-go-coverage.sh
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go run ./cmd/schemagen -check
      - run: sh scripts/test-check-stable-gates.sh
      - run: sh scripts/test-prepare-staging-evidence.sh
      - run: sh scripts/test-repackage-signed.sh

  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          precedence="${version%%+*}"
          if [[ "$version" == 0.* || "$precedence" == *-* ]]; then
            echo "channel=preview" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

  preview:
    if: needs.classify.outputs.channel == 'preview'
    needs: [test, classify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preview-release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TALENTO_RELEASE_PUBLIC_KEY: ${{ vars.TALENTO_RELEASE_PUBLIC_KEY }}
          TALENTO_RELEASE_PRIVATE_KEY: ${{ secrets.TALENTO_RELEASE_PRIVATE_KEY }}
      - name: Stage explicit release assets
        shell: bash
        run: |
          cp release-extra/*.zip dist/
          cp release-extra/installers/install.sh dist/
          go run ./cmd/artifactcheck --dir dist --copy-to release-dist
      - name: Generate and verify release metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse "$GITHUB_SHA")"
          date="$(git show -s --format=%ct "$GITHUB_SHA")"
          go run ./cmd/packageindexes --version "$version" --checksums release-dist/checksums.txt --output package-indexes
          go run ./cmd/releaselockstep --tag "$GITHUB_REF_NAME" --commit "$commit" --date "$date" --dist release-dist --indexes package-indexes
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-dist/*
      - name: Publish immutable preview release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" release-dist/* --verify-tag --prerelease --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-indexes
          path: package-indexes
          if-no-files-found: error
          retention-days: 7

  stable-preflight:
    if: needs.classify.outputs.channel == 'stable'
    needs: [test, classify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: stable-release-gates
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Validate stable release gates
        run: ./scripts/check-stable-gates.sh
        env:
          TALENTO_RELEASE_PUBLIC_KEY: ${{ vars.TALENTO_RELEASE_PUBLIC_KEY }}
          TALENTO_RELEASE_PRIVATE_KEY: ${{ secrets.TALENTO_RELEASE_PRIVATE_KEY }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}

  stable-base:
    needs: stable-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stable-release-gates
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TALENTO_RELEASE_PUBLIC_KEY: ${{ vars.TALENTO_RELEASE_PUBLIC_KEY }}
      - shell: bash
        run: |
          cp release-extra/*.zip dist/
          cp release-extra/installers/install.sh dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-base
          path: dist
          if-no-files-found: error
          retention-days: 3

  sign-macos:
    needs: stable-preflight
    environment: stable-release-gates
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Import Developer ID certificate
        shell: bash
        run: |
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "$RUNNER_TEMP_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP_PASSWORD" build.keychain
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          RUNNER_TEMP_PASSWORD: temporary-keychain-password
      - name: Build, sign, and notarize
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse "$GITHUB_SHA")"
          date="$(git show -s --format=%ct "$GITHUB_SHA")"
          GOOS=darwin GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/talentohq/talento-cli/internal/buildinfo.Version=$version -X github.com/talentohq/talento-cli/internal/buildinfo.Commit=$commit -X github.com/talentohq/talento-cli/internal/buildinfo.Date=$date -X github.com/talentohq/talento-cli/internal/buildinfo.Source=release -X github.com/talentohq/talento-cli/internal/buildinfo.MetadataFingerprint=talento-release-metadata:$version:$commit:$date:release -X github.com/talentohq/talento-cli/internal/buildinfo.ReleasePublicKey=$TALENTO_RELEASE_PUBLIC_KEY" -o talento ./cmd/talento
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" talento
          codesign --verify --strict --verbose=2 talento
          ditto -c -k --keepParent talento talento-notarize.zip
          xcrun notarytool submit talento-notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          ./talento --agent version
        env:
          TALENTO_RELEASE_PUBLIC_KEY: ${{ vars.TALENTO_RELEASE_PUBLIC_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darwin-${{ matrix.arch }}
          path: talento
          if-no-files-found: error
          retention-days: 3

  stable-stage:
    needs: [stable-base, sign-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stable-release-gates
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-base
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: darwin-*
          path: signed
      - name: Repackage signed binaries and rebuild release metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dist="$(pwd)/dist"
          signed="$(pwd)/signed"
          ./scripts/repackage-signed.sh "$dist" "$signed" "$version"
          find dist -maxdepth 1 -type f \( -name 'checksums.txt*' -o -name '*.spdx.json' \) -delete
          for archive in dist/*.tar.gz; do syft "$archive" -o "spdx-json=$archive.spdx.json"; done
          go run ./cmd/releasechecksums --dir dist --output dist/checksums.txt
          go run ./cmd/signchecksums --input dist/checksums.txt --output dist/checksums.txt.sig
          cosign sign-blob --bundle=dist/checksums.txt.sigstore.json dist/checksums.txt --yes
          go run ./cmd/artifactcheck --dir dist --copy-to release-dist
          go run ./cmd/packageindexes --version "$version" --checksums release-dist/checksums.txt --output package-indexes
          commit="$(git rev-parse "$GITHUB_SHA")"
          date="$(git show -s --format=%ct "$GITHUB_SHA")"
          go run ./cmd/releaselockstep --tag "$GITHUB_REF_NAME" --commit "$commit" --date "$date" --dist release-dist --indexes package-indexes
        env:
          TALENTO_RELEASE_PUBLIC_KEY: ${{ vars.TALENTO_RELEASE_PUBLIC_KEY }}
          TALENTO_RELEASE_PRIVATE_KEY: ${{ secrets.TALENTO_RELEASE_PRIVATE_KEY }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-release
          path: release-dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-indexes
          path: package-indexes
          if-no-files-found: error
          retention-days: 7

  smoke-packaged-unix:
    if: always() && (needs.preview.result == 'success' || needs.stable-stage.result == 'success')
    needs: [preview, stable-stage]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            arch: arm64
          - runner: macos-15-intel
            goos: darwin
            arch: amd64
          - runner: macos-15
            goos: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Download staged stable release assets
        if: needs.stable-stage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release
          path: smoke
      - name: Download published preview archive
        if: needs.preview.result == 'success'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="talento_${version}_${{ matrix.goos }}_${{ matrix.arch }}.tar.gz"
          mkdir -p smoke
          gh release download "$GITHUB_REF_NAME" -R talentohq/talento-cli -p "$asset" -D smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Exercise release archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="talento_${version}_${{ matrix.goos }}_${{ matrix.arch }}.tar.gz"
          mkdir home config
          tar -xzf "smoke/$asset" -C smoke
          test -s smoke/completions/talento.bash
          test -s smoke/completions/_talento
          test -s smoke/completions/talento.fish
          test -s smoke/completions/talento.ps1
          TALENTO_HOME="$PWD/home" TALENTO_CONFIG_DIR="$PWD/config" smoke/talento --agent version
          TALENTO_HOME="$PWD/home" TALENTO_CONFIG_DIR="$PWD/config" smoke/talento completion bash >/dev/null
          TALENTO_HOME="$PWD/home" TALENTO_CONFIG_DIR="$PWD/config" smoke/talento setup --agent codex --scope user --yes --json >/dev/null
          TALENTO_HOME="$PWD/home" TALENTO_CONFIG_DIR="$PWD/config" smoke/talento doctor --json >/dev/null
          # Do not call `talento upgrade` here. It talks to GitHub Releases, which
          # does not exist until after this job, and unauthenticated runner IPs
          # hit the API rate limit. doctor already records the update check.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Exercise packaged TUI terminal startup and cleanup
        run: TALENTO_TUI_BINARY="$PWD/smoke/talento" go test -count=1 ./internal/tui -run '^TestTUIPackagedStartup$'

  stable-publish:
    if: >-
      always() &&
      needs.stable-stage.result == 'success' &&
      needs.smoke-packaged-unix.result == 'success'
    needs: [stable-stage, smoke-packaged-unix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: stable-release-gates
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release
          path: release-dist
      - name: Publish immutable stable release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" release-dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-homebrew:
    if: always() && (needs.preview.result == 'success' || needs.stable-publish.result == 'success')
    needs: [preview, stable-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-indexes
          path: indexes
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: talentohq/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: false
      - shell: bash
        run: |
          mkdir -p tap/Casks
          cp indexes/Casks/talento.rb tap/Casks/talento.rb
          cd tap
          git config user.name talentohq-release-bot
          git config user.email releases@talentohq.com
          git add Casks/talento.rb
          git diff --cached --quiet || git commit -m "talento $GITHUB_REF_NAME"
          gh auth setup-git
          git push
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
